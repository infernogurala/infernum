<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download — Utopia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Infernum Obsidian Dark Palette ── */
      --bg: #030303;
      --surface: rgba(255, 255, 255, 0.03);
      --card: rgba(255, 255, 255, 0.015);
      --border: rgba(255, 255, 255, 0.06);
      --text: #ffffff;
      --sub: rgba(255, 255, 255, 0.6);
      --dim: rgba(255, 255, 255, 0.35);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --line: rgba(255, 255, 255, 0.08);
      --btn-bg: #ffffff;
      --btn-fg: #000000;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 5rem 1.5rem 3rem 1.5rem;
      position: relative;
    }

    /* Grain Overlay */
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0.02;
      pointer-events: none;
      z-index: 9999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Ambient Gradients */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.35;
      mix-blend-mode: screen;
      will-change: transform;
    }

    .orb-1 {
      top: -15%;
      left: 15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--accent-purple) 0%, transparent 70%);
    }

    .orb-2 {
      bottom: -15%;
      right: 15%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, var(--accent-cyan) 0%, transparent 70%);
    }

    .wrap {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      position: relative;
      z-index: 1;
      margin: auto 0;
    }

    /* HEAD */
    /* HEAD */
    .head {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 1.4rem;
    }

    .site-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 400;
      color: var(--dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.3s ease, opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-block;
      opacity: 0;
      transform: translateY(6px);
    }
    .site-tag:hover { color: #ffffff; }

    .app-name {
      font-family: 'Outfit', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-top: 4px;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.85) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      will-change: transform, opacity, letter-spacing;
    }

    /* BLOCK (Glassmorphic Table) */
    .block {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.5rem 1.4rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child {
      border-bottom: none;
    }

    .row-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sub);
    }

    .row-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--text);
      letter-spacing: 0.01em;
      transition: opacity 0.3s;
    }

    /* BUTTON WRAP & MORPH TRIGGERS */
    .btn-wrap {
      padding-top: 0.25rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: center;
    }

    .dl-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 48px;
      padding: 0 1.5rem;
      background: var(--btn-bg);
      border: 1px solid var(--btn-bg);
      color: var(--btn-fg);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
    }

    .dl-btn:hover {
      background: transparent;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(255, 255, 255, 0.08);
    }
    .dl-btn:active {
      transform: translateY(0);
    }

    .btn-text-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 1;
    }

    .btn-arrow {
      font-size: 1.1rem;
      line-height: 1;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 1;
    }
    .dl-btn:hover .btn-arrow {
      transform: translateY(2px);
    }

    /* NOTE */
    .note-wrap {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      padding-left: 0.25rem;
    }

    .note {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--sub);
      letter-spacing: 0.02em;
      line-height: 1.6;
    }

    .note a {
      color: #60a5fa;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s;
    }
    .note a:hover {
      color: #ffffff;
    }

    /* FOOTER */
    .foot {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-align: center;
      border-top: 1px solid var(--line);
      padding-top: 1.5rem;
      margin-top: 1rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Cinematic Text-Blur Boot Loader */
    .intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #020202;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      will-change: opacity;
    }

    .intro-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .intro-logo {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      filter: blur(12px);
      opacity: 0;
      transform: scale(0.94);
      animation: cinematicReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: filter, opacity, transform, letter-spacing;
      transition: opacity 0.3s ease;
    }

    .intro-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--dim);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease forwards 0.4s;
    }

    .intro-bar-container {
      width: 110px;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      border-radius: 1px;
      opacity: 0;
      animation: fadeIn 1s ease forwards 0.6s;
    }

    .intro-bar {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #ffffff, transparent);
      animation: progressFill 1.3s cubic-bezier(0.5, 0, 0.2, 1) forwards 0.5s;
    }

    @keyframes cinematicReveal {
      0% {
        filter: blur(15px);
        opacity: 0;
        letter-spacing: 0.6em;
        transform: scale(0.9);
      }
      100% {
        filter: blur(0);
        opacity: 1;
        letter-spacing: 0.22em;
        transform: scale(1);
      }
    }

    @keyframes progressFill {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ANIMATIONS */

    @media (max-width: 400px) {
      body { padding: 4rem 1rem 2.5rem 1rem; }
      .wrap { margin: 1.5rem 0; }
    }
  </style>
</head>
<body>
  <div class="grain-overlay"></div>
  
  <div class="ambient-glow">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Cinematic Text-Blur Boot Loader -->
  <div class="intro-screen" id="intro-screen">
    <div class="intro-content">
      <div class="intro-logo" id="intro-logo">Utopia</div>
      <div class="intro-subtitle">Android App</div>
      <div class="intro-bar-container">
        <div class="intro-bar"></div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <!-- Head -->
    <div class="head">
      <a class="site-tag" href="/">INFERNUM</a>
      <h1 class="app-name" id="main-logo">Utopia</h1>
    </div>

    <!-- Data Table -->
    <div class="block">
      <div class="row">
        <span class="row-label">Platform</span>
        <span class="row-value">Android</span>
      </div>
      <div class="row">
        <span class="row-label">Format</span>
        <span class="row-value">Play Store</span>
      </div>
      <div class="row">
        <span class="row-label">Requires</span>
        <span class="row-value">Android 8.0+</span>
      </div>
    </div>

    <!-- Button -->
    <div class="btn-wrap">
      <a class="dl-btn" href="https://play.google.com/store/apps/details?id=com.superwave.utopia" target="_blank" rel="noopener">
        <span class="btn-text-wrap">
          <svg class="play-icon" viewBox="0 0 28.99 31.99" width="18" height="20" xmlns="http://www.w3.org/2000/svg">
            <path d="M13.54 15.28.12 29.34a3.66 3.66 0 0 0 5.33 2.16l15.1-8.6Z" fill="#ea4335"/>
            <path d="m27.11 12.89-6.53-3.74-7.35 6.45 7.38 7.28 6.48-3.7a3.54 3.54 0 0 0 1.5-4.79 3.62 3.62 0 0 0-1.5-1.5z" fill="#fbbc04"/>
            <path d="M.12 2.66a3.57 3.57 0 0 0-.12.92v24.84a3.57 3.57 0 0 0 .12.92L14 15.64Z" fill="#4285f4"/>
            <path d="m13.64 16 6.94-6.85L5.5.51A3.73 3.73 0 0 0 3.63 0 3.64 3.64 0 0 0 .12 2.65Z" fill="#34a853"/>
          </svg>
          <span>Get it on Google Play</span>
        </span>
        <span class="btn-arrow">→</span>
      </a>
    </div>

    <!-- Note -->
    <div class="note-wrap">
      <p class="note">Available now on the Google Play Store for Android devices.</p>
    </div>

    <!-- Footer -->
    <p class="foot">© 2026 INFERNUM</p>
  </div>

  <script>
    // ── INTERACTIVE ORB GRAVITY DRIFT ────────────────────────────────
    const orb1 = document.querySelector('.orb-1');
    const orb2 = document.querySelector('.orb-2');
    
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    
    let orb1X = 0;
    let orb1Y = 0;
    let orb2X = 0;
    let orb2Y = 0;
    
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });
    
    function updateOrbs() {
      const target1X = (mouseX - window.innerWidth / 2) * 0.08;
      const target1Y = (mouseY - window.innerHeight / 2) * 0.08;
      
      const target2X = (mouseX - window.innerWidth / 2) * -0.06;
      const target2Y = (mouseY - window.innerHeight / 2) * -0.06;
      
      orb1X += (target1X - orb1X) * 0.04;
      orb1Y += (target1Y - orb1Y) * 0.04;
      
      orb2X += (target2X - orb2X) * 0.04;
      orb2Y += (target2Y - orb2Y) * 0.04;
      
      orb1.style.transform = `translate(${orb1X}px, ${orb1Y}px)`;
      orb2.style.transform = `translate(${orb2X}px, ${orb2Y}px)`;
      
      requestAnimationFrame(updateOrbs);
    }
    updateOrbs();

    // ── HYBRID SEAMLESS LOGO FLIP & INTRO REVEAL ──────────────────
    window.addEventListener('DOMContentLoaded', () => {
      const introLogo = document.getElementById('intro-logo');
      const mainLogo = document.getElementById('main-logo');
      const intro = document.getElementById('intro-screen');
      const siteTag = document.querySelector('.site-tag');
      const block = document.querySelector('.block');
      const btnWrap = document.querySelector('.btn-wrap');
      const noteWrap = document.querySelector('.note-wrap');
      const foot = document.querySelector('.foot');
      
      setTimeout(() => {
        const introRect = introLogo.getBoundingClientRect();
        const mainRect = mainLogo.getBoundingClientRect();
        
        if (introRect.width === 0) return;
        
        const scaleX = introRect.width / mainRect.width;
        const scaleY = introRect.height / mainRect.height;
        const deltaX = introRect.left - mainRect.left;
        const deltaY = introRect.top - mainRect.top;
        
        mainLogo.style.transition = 'none';
        mainLogo.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(${scaleX}, ${scaleY})`;
        mainLogo.style.letterSpacing = '0.22em';
        mainLogo.style.opacity = '1';
        
        introLogo.style.opacity = '0';
        intro.style.transition = 'opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
        intro.style.opacity = '0';
        intro.style.pointerEvents = 'none';
        
        mainLogo.offsetHeight;
        
        mainLogo.style.transition = 'transform 1.1s cubic-bezier(0.16, 1, 0.3, 1), letter-spacing 1.1s cubic-bezier(0.16, 1, 0.3, 1)';
        mainLogo.style.transform = 'translate(0, 0) scale(1)';
        mainLogo.style.letterSpacing = '-0.02em';
        
        setTimeout(() => {
          siteTag.style.opacity = '1';
          siteTag.style.transform = 'translateY(0)';
          
          setTimeout(() => {
            block.style.opacity = '1';
            block.style.transform = 'translateY(0)';
          }, 100);
          
          setTimeout(() => {
            btnWrap.style.opacity = '1';
            btnWrap.style.transform = 'translateY(0)';
          }, 200);
          
          setTimeout(() => {
            noteWrap.style.opacity = '1';
            noteWrap.style.transform = 'translateY(0)';
          }, 300);
          
          setTimeout(() => {
            foot.style.opacity = '1';
            foot.style.transform = 'translateY(0)';
          }, 400);
          
          setTimeout(() => {
            if (intro.parentNode) intro.remove();
          }, 900);
        }, 300);
      }, 2000);
    });
  </script>
</body>
</html>
